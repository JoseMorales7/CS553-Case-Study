# This file was creating with GPT6.1 sol in response to the following query

# Could you now modify the docker/compose.yaml file such that it spins up the app container with some image name (i'll replace later), 
# the container for the prometheus collection server, the container for the grafana server, and the container for ngrok?

services:
  cs553-app:
    container_name: group6_critic_app
    image: ${APP_IMAGE:-cs553-app:latest}
    networks:
      - monitoring
    restart: unless-stopped
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"

  prometheus:
    container_name: group6_prometheus
    image: prom/prometheus:latest
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - cs553-app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:2502:9090"

  grafana:
    container_name: group6_grafana
    image: grafana/grafana:latest
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "2503:3000"

  ngrok:
    container_name: group6_ngrok
    image: ngrok/ngrok:latest
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - cs553-app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN}
    command: ["http", "http://cs553-app:7860", "--log=stdout"]

networks:
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

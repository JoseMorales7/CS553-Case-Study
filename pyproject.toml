[project]
name = "cs553-case-study"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "einops>=0.8.2",
    "gradio>=6.29.0",
    "huggingface-hub>=1.33.0",
    "pillow>=12.3.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
